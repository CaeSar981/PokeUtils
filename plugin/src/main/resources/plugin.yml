name: PokeUtils-remake
main: com.mc9y.pokeutils.PokeUtils
depend:
  - PokeStar
  - Vault
  - PokemonAPI
  - MSGToggle
# 说明：原 plugin.yml 还声明了 - PokeStatsAPI，但全量字节码对
# com.mc9y.pokestatsapi 零引用（反射也没有），是纯挂名依赖，故移除。
version: 1.0
commands:
  pokeutils:
    aliases:
      - pu
      - putils
      - pokeu
    description: Command for PokeUtils
permissions:
  # 说明：原 plugin.yml 里没有 permissions 段，插件用到的权限节点只能靠管理员
  # 在权限插件里手写字符串；这里把它们声明出来，配置界面里就能直接看到。
  # 注意「是否需要 pokeutils.use」由 config.yml 的 Compound.use-permission 决定，
  # 留空则所有人可用（与原插件行为一致）。
  #
  # 第四轮新增的五个功能（分解 / 洗练 / 粘剂合成 / 每日委托 / 合成图鉴）刻意
  # 【不】挂权限节点，而是走 config.yml 里的开关（Compound.salvage.enabled 等）。
  # 理由：它们是「玩法内容」而不是「管理能力」，开关放在配置里，管理员改一行就能
  # 临时关闭，不必去权限插件里逐个节点改；也让「功能是否存在」与「谁能用」两件事
  # 不会纠缠在一起。唯一例外是 /pu questreset —— 它能作废别人的委托，属于管理能力，
  # 因此走已有的 pokeutils.admin。
  pokeutils.use:
    description: 允许使用 /pu compound 打开合成界面（默认所有人可用，除非配置要求）
    default: true
  pokeutils.admin:
    description: 允许使用 /pu g、/pu take、/pu bal <他人>、/pu storage、/pu migrate、/pu debug、/pu reload 等管理指令
    default: op
  vip.yx:
    description: 合成七星失败时保留一只精灵（优秀训练师）。节点名可在 config.yml 的 VIP.keep-one 中调整
    default: false
  vip.cs:
    description: 合成七星失败时保留一只精灵（传说训练师）。节点名可在 config.yml 的 VIP.keep-one 中调整
    default: false
