Info:
  name: "&3精灵合成使用方法"
  lore:
    - "§b"
    - " &3&k||&a 使用2个低星级精灵可合成1个高星级精灵 "
    - " &3&k||&a 每次合成都会消耗2只同星级精灵 + 1个粘剂"
    - " &3&k||&a 最高只能合成至7星精灵, 七星精灵无法再合成"
    - " &3&k||&a 每次合成都会消耗一定数量的金币"
    # 「{price}」会被替换成按 Compound.price 自动生成的价格表（六行）。
    # 把它删掉就不会显示价格 —— 说明书里的价格不会再和实际扣费脱节。
    - "{price}"
    - " &3&k||&a 如果合成七星失败, 优秀训练师/传说训练师将会保留一只精灵"
    - "§d"

VIP:
  # 合成七星失败时，拥有以下任一权限节点的玩家会随机保留一只精灵。
  # 注：原插件这一处写成了 vip.yx || vip.yx（同一节点写了两遍），第二个节点已无从得知，
  #     故在此做成可配置项，按「优秀训练师 / 传说训练师」补为以下两条，可自行调整。
  keep-one:
    - "vip.yx"
    - "vip.cs"

Compound:
  # 本段所有数值都可以用 `/pu reload` 热重载，无需重启服务器。
  # 缺省值与原实现完全一致，所以旧的配置文件（没有本段）行为与本插件重写前一模一样。

  # 金币消耗。key = 作为原料的星级，即 1 表示「一星 -> 二星」。
  price:
    1: 1000
    2: 10000
    3: 30000
    4: 100000
    5: 400000
    6: 1000000

  # 基础成功率（%）。key = 作为原料的星级。
  # 原实现是公式 (11 - 星级 - 3) * 10，展开后正是下面这组值。
  base-rate:
    1: 70
    2: 60
    3: 50
    4: 40
    5: 30
    6: 20

  # 粘剂列表（修复：原本 PT / JL 硬编码在代码的六处 switch 里，加一种粘剂必须重新编译）。
  # 想加一种「传说粘剂」只需在这里追加一项，界面、点击判定、成功率都会自动跟上。
  #   key          存储键，也是数据库里的列名，别改已上线粘剂的 key（会读不到旧数据）
  #   display      界面显示名
  #   material     Bukkit 材质名
  #   potion       可选，写入药水的 Potion NBT（做「水瓶」外观用），不需要就删掉这一行
  #   rate         使用后提供的成功率加成（%）
  #   insufficient 数量不足时的提示文案（会接在「你没有足够的」后面）
  #   slot         可选，粘剂选择界面上的槽位；不写则从 19 起依次递增（原实现即 19 / 20）
  #                注意 21~25、28~34 在界面上是「未解锁」的屏障，粘剂不要往那里放
  #   protect      可选（第四轮新增），默认 false。true = 保护符：
  #                带它合成失败时【不消耗材料精灵】，只损失粘剂与金币。
  #                六转七只有 20% 基础成功率，一次失败就是 80 万金币 + 两只六星精灵，
  #                保护符把「倾家荡产」降到「一次粘剂」，是让玩家敢下手的关键。
  #   pool         可选（第四轮新增），默认空。定向粘剂：非空时产物只从
  #                【本次目标档位产出池 ∩ 这个列表】里抽。列表里写了但目标档位没有的
  #                名字会被自动忽略；若交集为空则退回不限定（并在控制台打一次提示）。
  #                示例：
  #                  - key: XL
  #                    display: "§c定向粘剂 · 水系"
  #                    material: PRISMARINE_CRYSTALS
  #                    rate: 0
  #                    insufficient: "§c 定向粘剂"
  #                    pool: [Squirtle, Wartortle, Blastoise, Psyduck, Golduck]
  stickers:
    - key: PT
      display: "§f普通粘剂"
      material: POTION
      potion: "minecraft:water"
      rate: 10
      insufficient: "§f 普通粘剂"
    - key: JL
      display: "§a精良粘剂"
      material: DRAGONS_BREATH
      rate: 30
      insufficient: "§a 精良粘剂"

  # 合成失败时，返还已消耗金币的百分比。
  # 注：只有 Compound.refund.mode 含「money」时才生效。
  refund-percent: 20

  # 合成失败补偿方式（本次新增）：
  #   money   只返金币（默认，与原实现一致）
  #   sticker 只送粘剂
  #   both    两者都给
  # 金币对已经投入很多的玩家来说是最没感觉的补偿；配成 sticker 之后，
  # 玩家手里会多一次可用于下一次合成的资源，继续玩下去的意愿完全不同。
  refund:
    mode: money
    # mode 含 sticker 时送哪种粘剂（键名取自 Compound.stickers）。
    sticker-type: PT
    sticker-amount: 1
    # 只有材料星级 >= 本值时才送粘剂（0 = 不限）。设成 3 就是「只补三星以上的失败」。
    min-star: 0
    # 用合成券合成失败时，把券退还玩家（默认 true）。
    # 用券时金币消耗为 0，所以上面那条「返还 x% 金币」对用券的玩家完全不生效 ——
    # 不退还就等于券 + 粘剂 + 两只精灵全损，而用金币失败至少还能拿回 20%。
    # 背包满时券会掉在玩家脚下，不会凭空消失。
    voucher-on-failure: true

  # 连续失败保底：同一玩家连续失败达到 threshold 次后，下一次必定成功。
  # 计数按玩家持久化在 SQLite（plugins/PokeUtils/pokeutils.db），成功后清零。
  # enabled 设为 false，或 threshold 设为 0，即可关闭。
  pity:
    enabled: true
    threshold: 5
    # 按档位单独定阈值（本次新增）。key = 作为原料的星级，即 1 表示「一星 -> 二星」。
    # 没在这里列出的档位，一律回退到上面的 threshold 单值。
    #
    # 为什么需要它：计数是**分档累计**的（见下），而各档的失败代价差得很远
    # —— 一星档失败一次亏 1000 金币，六星档亏 100 万。同一套阈值套在所有档位上，
    # 要么让高星档的保底遥不可及，要么让低星档轻易触发。
    # 示例（按需要打开）：
    #   1: 3      # 低星档失败不心疼，保底来得快一点，维持正向反馈
    #   6: 8      # 六星档一次 100 万，玩家对连败的耐受度完全不同
    threshold-by-star: {}
    # 失败后的进度提示方式（本次新增）：
    #   chat      聊天栏消息（默认）
    #   actionbar 物品栏上方的动作栏文字（走反射，服务端不支持时自动回落 chat）
    #   both      两者都发
    #   none      不提示
    notify: chat
    # 占位符: {streak} 当前连败次数 / {threshold} 保底阈值 / {left} 还差几次
    message: "§e连续失败 §f{streak} §e/ §f{threshold} §7· 再失败 §f{left} §7次必定成功"

  # 高星合成成功时的全服播报（走 MSGToggle 的 flow view）。
  # 原实现写死为「>=6 星」且文案不可改，这里抽成配置。
  # 文案占位符：{player} 玩家名、{star} 星级显示名（如 §c七星精灵）、{pokemon} 精灵名。
  broadcast:
    enabled: true
    min-star: 6
    message: "§a恭喜玩家 §f{player} §a合成出了一只 §f{star} §f{pokemon}"

  # 合成冷却（毫秒）。防止连点器 / 宏在一瞬间连点合成按钮。
  # 0 = 不限制。玩家在冷却内点击不会有任何消耗，只会收到一条提示。
  cooldown-ms: 0

  # 放入高星材料时的二次确认：两只材料星级都达到本值时，需要再点一次确认才会真正合成。
  # 0 = 关闭。设为 5 表示五星及以上。用于防止手滑把六星精灵直接烧掉。
  confirm-min-star: 5

  # 合成配方（本次新增，默认值与原来一致）：
  #   material-count    需要放入的同星级精灵数量（1 或 2）
  #   sticker-required  是否必须放入粘剂；false 时粘剂变成可选加成
  material-count: 2
  sticker-required: true

  # 权限组折扣与加成（本次新增）。按顺序取「第一个命中的权限组」，不做叠加 ——
  # 叠加会让多重继承的玩家算出一个谁也说不清的数。
  # 默认留空，即不改变任何行为。示例：
  #   groups:
  #     - permission: "group.vip"
  #       price-multiplier: 0.8    # 金币消耗打八折
  #       rate-bonus: 5            # 成功率 +5%
  #     - permission: "group.mvp"
  #       price-multiplier: 0.5
  #       rate-bonus: 10
  groups: []

  # 合成券（本次新增）：一种可以直接顶一次合成的金币消耗的物品。
  # 背包里有匹配的券时，合成优先扣券、不扣金币。适合做活动、补偿、礼包 ——
  # 不动经济系统，也不会像直接发金币那样立刻造成通胀。
  # 默认留空。示例：
  #   vouchers:
  #     - material: PAPER            # 必填，Bukkit 材质名
  #       name: "§d高级合成券"        # 可选，精确匹配显示名（含颜色代码）
  #       lore-keyword: "合成券"      # 可选，lore 里必须包含的关键字
  #       star-limit: 4              # 可选，0 = 不限；4 = 只能用于四星及以下的合成
  #       display: "§d高级合成券"     # 可选，提示文案里怎么称呼它
  vouchers: []

  # 产出预览（本次新增）：合成界面上的「产出预览」按钮，列出目标档位的全部可能产出。
  # 数据取自真实 PokeStar 的产出表，所以预览里有的就是能合出来的。
  preview:
    enabled: true
    page-size: 45

  # 从电脑盒子取合成材料（本次新增，A1）。
  # 关掉之后材料只能从队伍的 6 格里出 —— 那本身就是一道节奏阀（一次能合几只被队伍格数限制住）。
  # 打开则玩家可以直接把盒子里的收藏品当材料，不必先开 PC 把它移进队伍。
  # 注意这是**会改变玩法**的开关，不是纯界面选项：开着的时候，「把一只精灵升级」
  # 不再需要它先待在队伍里，于是合成频率会明显高于关着的时候。
  pc:
    enabled: true

  # 合成流水日志：每次合成都往 plugins/PokeUtils/logs/compound-<日期>.log 追加一行。
  # 用于事后处理纠纷、复盘经济产出。字段用制表符分隔，方便直接丢进表格软件。
  #   /pu history 读它查玩家记录，/pu stats 与 /pu top 在它上面做聚合。
  log:
    enabled: true
    # 启动时清理超过本天数的日志文件（0 = 不清理）。日志按天分文件但从不清理的话，
    # 长期运行会一直堆积。
    keep-days: 30

  # /pu history 与 /pu stats 的行为（本次新增）。
  history:
    # 默认显示多少条记录（上限 50）
    size: 10
    # 统计类命令最多往回扫多少行日志，防止日志很大时把主线程卡住
    max-scan-lines: 50000

  # 界面反馈（本次新增）：音效与成功 Title。
  # 音效名用 Bukkit 的 Sound 枚举名；留空表示该处不发声。
  # 注意：1.12.2 的 spigot-api 没有 Player#sendActionBar，pity.notify 的 actionbar
  #       是走反射尝试的，服务端没有就自动回落成聊天消息。
  feedback:
    sounds:
      open: BLOCK_CHEST_OPEN
      select: UI_BUTTON_CLICK
      success: ENTITY_PLAYER_LEVELUP
      fail: BLOCK_ANVIL_LAND
      volume: 1.0
      pitch: 1.0
    title:
      enabled: true
      title: "§a合成成功"
      subtitle: "§f{star} §f{pokemon}"
      fade-in: 5
      stay: 30
      fade-out: 10

  # ======================================================================
  #  【第四轮新增 · 属性继承】让「用哪两只精灵去合」重新变得有意义
  # ----------------------------------------------------------------------
  #  在此之前，两只同星级精灵是完全等价的 —— 玩家没有任何决策空间，
  #  抓精灵这件事也就失去了意义。开启继承后，个体值高的材料和随便抓的材料
  #  开始有区别，玩家才会主动去筛选。
  # ======================================================================
  inherit:
    # 关掉后「继承设置」按钮不再显示，合成行为退回到「产物完全随机」。
    enabled: true
    # 一次合成最多可以同时勾选几项（性格 / 特性 / 个体值）。0 = 关闭继承。
    # 默认 1 是刻意的：多选会让「选哪个」这个决策消失，产物也容易强到破坏平衡。
    max-picks: 1
    # 产物某项个体值 = 在「两只父本该值构成的区间」内按比例取点。
    # 50 / 100 的含义是「不低于两只父本的中位、最好能取到较高的那一只」——
    # 让「用高个体材料」有明确回报，又不会让产物稳定满个体。
    iv-percent:
      min: 50
      max: 100
    # 父本闪光带来的产物闪光加成（%）。单只闪光 / 两只都闪光。
    # 刻意不做成「父本闪光 -> 产物必定闪光」：那会把闪光的稀缺性直接抹平。
    shiny:
      single-bonus: 5
      double-bonus: 25

  # ======================================================================
  #  【第四轮新增 · 洗练】对已经到手的精灵重掷单项属性
  # ----------------------------------------------------------------------
  #  继承解决的是「材料好不好」，洗练解决的是「产物不够好怎么办」。
  #  没有洗练时，好不容易合出的高星精灵只要个体值歪了就成了废品，
  #  玩家唯一的选择是再烧一遍材料 —— 那基本等于劝退。
  # ======================================================================
  reroll:
    enabled: true
    # 每次洗练消耗的金币与粘剂（粘剂留空则只扣金币）。
    price: 20000
    sticker-type: PT
    sticker-amount: 1
    # 单个个体值洗练的取值范围。Pixelmon 的合法区间是 0~31。
    iv-min: 0
    iv-max: 31
    # true = 只有洗出的值比原来的更好才替换（纯提升，绝不会把好个体洗坏）。
    # false = 真的重掷，可能变差 —— 更像传统洗练，也更能消耗资源。
    improve-only: false

  # ======================================================================
  #  【第四轮新增 · 分解回收】给产物一个出口，同时让失败不再那么致命
  # ----------------------------------------------------------------------
  #  没有分解时，「合歪了的高星精灵」和「重复产出的低星精灵」都只能烂在队伍里。
  #  有分解之后，它们能换回粘剂和金币 —— 也就是下一次合成的入场券。
  # ======================================================================
  salvage:
    enabled: true
    # 按星级返还的粘剂数量（key = 精灵星级）。没写的星级按 0 处理。
    sticker:
      1: 0
      2: 0
      3: 1
      4: 2
      5: 3
      6: 5
      7: 8
    # 返还哪种粘剂（键名取自 Compound.stickers）。
    sticker-type: PT
    # 金币返还 = 该星级合成价格的百分之多少（10 表示 「一星返 100、六星返 10 万」）。
    money-percent: 10

  # ======================================================================
  #  【第四轮新增 · 粘剂合成链】让粘剂自己也有消耗口与产出路径
  # ----------------------------------------------------------------------
  #  没有这条链时，低阶粘剂只会越积越多、高阶粘剂只能靠管理员发。
  # ======================================================================
  sticker-craft:
    enabled: true
    # 每一条就是一个配方：消耗 from 粘剂 amount 个 + 金币 money，得到 to 粘剂 result 个。
    recipes:
      - from: PT
        to: JL
        amount: 3
        result: 1
        money: 5000

  # ======================================================================
  #  【第四轮新增 · 每日委托】给玩家一个「今天上来要干什么」的理由
  # ----------------------------------------------------------------------
  #  委托按 (玩家 UUID + 日期) 确定性生成，同一人同一天永远是同一组，
  #  不需要在进服瞬间就写库，也不会出现「点开三次刷新出三套」。
  # ======================================================================
  quest:
    enabled: true
    # 每天生成几条。
    daily-amount: 3
    # 委托记录保留多少天（含今天）。超出的行会在**启动时**异步清掉。
    # 委托表是「每人每天 3 行、只增不减」的，而查询永远只看当天 —— 历史行只是占磁盘：
    # 1000 人服跑一年约 100 万行，备份体积和恢复时间都会跟着涨。
    #   7  = 保留最近一周（默认），足够回头查「这人的委托是不是没刷新」
    #   0  = 不清理，历史全留（自己另做归档时用这个）
    keep-days: 7
    # 每种委托的生成权重与目标次数档次。weight 设为 0 即不再生成该类。
    #   SUCCESS 成功合成 N 次        ATTEMPT 进行 N 次合成（不论成败）
    #   SALVAGE 分解回收 N 只精灵     STICKER 合成 N 次粘剂
    #   SUBMIT  交付一只 star 星及以上的精灵（目标次数固定为 1）
    # 占位符：{target} 目标次数、{star} 星级门槛。
    types:
      SUCCESS:
        weight: 3
        targets: [2, 3, 5]
        display: "§a成功合成 §f{target} §a次精灵"
      ATTEMPT:
        weight: 3
        targets: [3, 5, 8]
        display: "§a进行 §f{target} §a次精灵合成"
      SALVAGE:
        weight: 2
        targets: [1, 2, 3]
        display: "§a分解回收 §f{target} §a只精灵"
      STICKER:
        weight: 2
        targets: [1, 2, 3]
        display: "§a合成 §f{target} §a次粘剂"
      SUBMIT:
        weight: 2
        targets: [1]
        star: 4
        display: "§a交付一只 §f{star}星 §a及以上的精灵"
    # 每条委托完成后的奖励。
    reward:
      money: 20000
      sticker-type: PT
      sticker-amount: 2

  # ======================================================================
  #  【第四轮新增 · 合成图鉴】把「合出过什么」变成可以收集的长期目标
  # ======================================================================
  dex:
    enabled: true
    # 集齐 N 种不同精灵（以「合成产出过」为准）即可领取一次奖励，每个档位只能领一次。
    # 档位数字越小越容易达成；不写的档位不存在。
    rewards:
      5:
        money: 50000
        sticker-type: PT
        sticker-amount: 2
      10:
        money: 200000
        sticker-type: JL
        sticker-amount: 1
      20:
        money: 500000
        sticker-type: JL
        sticker-amount: 3

  # 打开合成界面的权限节点。留空 = 任何人可用。
  # 填上节点名（例如 pokeutils.use）后，玩家需要拥有该节点才能执行 /pu compound。
  # 注意：权限节点本身已写在 plugin.yml 里，可被权限插件直接识别。
  use-permission: ""

# 存储后端（本次新增）。玩家资产的持久化全在这里。
#   sqlite  本地文件，零依赖。单机/单服直接用这个（默认）
#   mysql   多个服务端共用一份数据时用这个
# 切换 type 需要重启服务器（/pu reload 不会重连数据库）。
# ⚠️ SQLite 与 MySQL 里是两份互相独立的数据，改 type 不会自动搬家。
Storage:
  type: sqlite

  sqlite:
    # 数据库文件。相对路径基于插件数据目录，也可以写绝对路径。
    file: pokeutils.db
    # WAL checkpoint 间隔（分钟）。0 = 不开启。
    # WAL 模式下的已提交数据先落在 pokeutils.db-wal 里，而默认的自动 checkpoint
    # 不会截断该文件 —— 一个从不重启的服能把它涨到很大（本项目测试服被反复强杀后
    # 实测 1.8MB），而 WAL 越大，下次打开数据库时回放越慢。定期合并回主库即可。
    checkpoint-minutes: 10

  mysql:
    host: 127.0.0.1
    port: 3306
    database: pokeutils
    user: root
    password: ""
    # 表名前缀，用来和同一个库里的其它插件的表隔开
    table-prefix: "pu_"
    use-ssl: false
    # MySQL 8 的 cj 驱动通常需要它（例如 Asia/Shanghai）；5.1 驱动留空即可
    server-timezone: ""
    # 连接池上限。写入走单线程 + 后台计算线程，4 足够
    pool-size: 4
    connect-timeout-ms: 5000
    borrow-timeout-ms: 3000
    # MySQL 连不上时是否自动回退到本地 SQLite（默认 true，与历史行为一致）。
    # ⚠️ 回退意味着服务端会**带着另一份数据**上线：玩家看到的粘剂数量来自本地库，
    #    而不是 MySQL。数据库重启的那几十秒里如果服也重启了，玩家会照常合成消耗，
    #    而这批变更只落在本地库里 —— 数据库恢复后两份数据就此分叉。
    #    想要「宁可合成不可用，也不带错数据」，改成 false：
    #    此时插件会以「存储不可用」状态加载（合成仍可玩，但不持久化），
    #    并在每个 OP 进服时给出提示。
    fallback-to-sqlite: true

  async:
    # 写回模式（本次新增）：
    #   auto    本地后端同步写穿、网络后端异步写回（默认）
    #   always  一律异步写回（主线程不等落库；强杀服务端会丢掉最后几毫秒的写入）
    #   never   一律同步写穿（写入返回即已落盘，最安全；MySQL 上每次写要等一次网络往返）
    write-behind: auto
    # 关服时最多等多久让写回队列排空（毫秒）
    flush-timeout-ms: 5000
    # 后台计算线程数（当前用于重建合成流水索引、重载配置）
    worker-threads: 2
